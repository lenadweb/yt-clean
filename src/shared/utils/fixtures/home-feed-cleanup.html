<!-- Sanitized current Home feed structure from the user's saved page. -->
<ytd-app><ytd-browse page-subtype="home" class="style-scope ytd-page-manager">
  <ytd-two-column-browse-results-renderer><div id="primary"><ytd-rich-grid-renderer><div id="contents">
    <ytd-rich-item-renderer id="home-sponsored-card"><div id="content"><ytd-ad-slot-renderer><div id="fulfilled-layout"><ytd-in-feed-ad-layout-renderer>
      <yt-lockup-view-model><feed-ad-metadata-view-model><ad-badge-view-model>Sponsored</ad-badge-view-model></feed-ad-metadata-view-model></yt-lockup-view-model>
    </ytd-in-feed-ad-layout-renderer></div></ytd-ad-slot-renderer></div></ytd-rich-item-renderer>
    <ytd-rich-item-renderer id="home-regular-video"><yt-lockup-view-model>Normal video</yt-lockup-view-model></ytd-rich-item-renderer>
    <ytd-rich-section-renderer id="home-shorts-section"><div id="content"><ytd-rich-shelf-renderer>
      <div id="dismissible"><div id="rich-shelf-header-container"><div id="rich-shelf-header"><h2>Shorts</h2></div></div>
        <ytm-shorts-lockup-view-model-v2></ytm-shorts-lockup-view-model-v2>
        <ytm-shorts-lockup-view-model></ytm-shorts-lockup-view-model>
      </div>
    </ytd-rich-shelf-renderer></div></ytd-rich-section-renderer>
    <ytd-rich-section-renderer id="home-other-section"><ytd-rich-shelf-renderer><yt-lockup-view-model>Other videos</yt-lockup-view-model></ytd-rich-shelf-renderer></ytd-rich-section-renderer>
  </div></ytd-rich-grid-renderer></div></ytd-two-column-browse-results-renderer>
</ytd-browse></ytd-app>
