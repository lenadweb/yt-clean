name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/manifest.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Get version from manifest.json
        id: version
        run: echo "version=$(jq -r .version src/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check feedback configuration
        if: steps.check.outputs.exists == 'false'
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
        run: |
          if [[ -z "${VITE_POSTHOG_PROJECT_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::Set the repository secret VITE_POSTHOG_PROJECT_TOKEN before releasing. It is required for feedback submission."
            exit 1
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build extension
        if: steps.check.outputs.exists == 'false'
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: |
          npx --no-install webpack --env platform=chrome
          npx --no-install webpack --env platform=opera

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "release/build-chrome-$VERSION.zip" \
            "release/build-opera-$VERSION.zip"
